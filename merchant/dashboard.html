<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | AVORA Business</title>
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' __SUPABASE_URL__; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0F1D2E">
  <link rel="icon" type="image/svg+xml" href="../logos/avora-icon-light-bg.svg">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../" aria-label="AVORA Technologies home">
        <img src="../logos/avora-logo-primary-light-bg.svg" alt="AVORA Technologies" width="460" height="130">
      </a>
      <nav class="account-nav" aria-label="Account">
        <a href="dashboard.html">Dashboard</a>
        <a href="settings.html">Settings</a>
        <button class="btn-text" id="logout" type="button">Log out</button>
      </nav>
    </div>
  </header>
  <main id="main" class="auth-wrap auth-wrap--wide">
    <div id="alert" role="alert" hidden></div>
    <div id="content" class="page-section" hidden>
      <h1>Welcome, <span id="welcome-name"></span></h1>
      <div class="card auth-card">
        <h2>Your account</h2>
        <dl class="summary">
          <dt>Email</dt><dd id="account-email"></dd>
          <dt>Mobile</dt><dd id="account-phone"></dd>
        </dl>
        <p><a href="settings.html">Edit your details</a></p>
      </div>
      <div class="card auth-card">
        <h2>Business setup</h2>
        <p>Adding your business, products and services comes next. It is not available yet.</p>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container">
      <img src="../logos/avora-logo-dark-bg.svg" alt="AVORA Technologies" width="460" height="130">
      <p>&copy; AVORA Technologies</p>
    </div>
  </footer>
  <script type="module" src="../assets/js/merchant/dashboard.js"></script>
</body>
</html>
