<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | AVORA Business</title>
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' __SUPABASE_URL__; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0F1D2E">
  <link rel="icon" type="image/svg+xml" href="../logos/avora-icon-light-bg.svg">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../" aria-label="AVORA Technologies home">
        <img src="../logos/avora-logo-primary-light-bg.svg" alt="AVORA Technologies" width="460" height="130">
      </a>
    </div>
  </header>
  <main id="main" class="auth-wrap">
    <div class="card card-raised auth-card">
      <h1>Log in to your account</h1>
      <div id="alert" role="alert" hidden></div>
      <form id="login-form" novalidate class="auth-card">
      <div class="field">
        <label for="email">Email address</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" aria-describedby="err-email" required>
        <span class="error-text" id="err-email" data-error-for="email" hidden></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-field"><input class="input" id="password" name="password" type="password" autocomplete="current-password" aria-describedby="err-password" required><button class="btn-text" type="button" data-toggle-password="password" aria-pressed="false">Show</button></div>
        <span class="error-text" id="err-password" data-error-for="password" hidden></span>
      </div>
      <button class="btn btn-primary" type="submit">Log in</button>
      </form>
      <p class="auth-links"><a href="forgot-password.html">Forgot your password?</a> <a href="register.html">Create an account</a></p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container">
      <img src="../logos/avora-logo-dark-bg.svg" alt="AVORA Technologies" width="460" height="130">
      <p>&copy; AVORA Technologies</p>
    </div>
  </footer>
  <script type="module" src="../assets/js/merchant/login.js"></script>
</body>
</html>
